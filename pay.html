<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>订单支付 - 运乘风水</title>
<meta name="robots" content="noindex">
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><rect width='100' height='100' rx='22' fill='%23241d10'/><text x='50' y='68' font-size='52' text-anchor='middle' fill='%23e6c886' font-family='serif'>运</text></svg>">
<link rel="stylesheet" href="assets/css/site.css">
</head>
<body>

<header class="topbar">
  <div class="wrap">
    <a class="brand" href="index.html">
      <span class="brand-seal">运</span>
      <span><span class="brand-name">运乘风水</span><br><span class="brand-sub">YUNCHENG · 户型居住环境分析</span></span>
    </a>
    <nav class="nav">
      <a href="index.html#why">为什么</a>
      <a href="index.html#flow">服务流程</a>
      <a href="index.html#price">价格</a>
      <a href="index.html#faq">常见问题</a>
      <a class="btn btn-gold btn-sm" href="upload.html">上传户型图</a>
    </nav>
  </div>
</header>

<main>
<div class="wrap page-head">
  <div class="eyebrow">STEP 03 · 支付</div>
  <h1>确认订单并支付</h1>
  <div class="flowbar">
    <span class="fb done">壹 · 微信登录</span>
    <span class="fb done">贰 · 上传户型</span>
    <span class="fb on">叁 · 支付 9.9</span>
    <span class="fb">肆 · 查看报告</span>
  </div>
</div>

<div class="wrap page-body" id="main"></div>
</main>

<footer>
  <div class="wrap">
    <div class="foot-brand">运 乘 风 水</div>
    <p>支付服务由微信支付提供；虚拟内容服务，报告生成即交付，支付成功后不支持退款。</p>
    <p style="opacity:.6;margin-top:8px">© 2026 运乘风水 · 内测期间功能陆续开放</p>
  </div>
</footer>

<script src="assets/js/config.js"></script>
<script src="assets/js/qrcode.min.js"></script>
<script src="assets/js/store.js"></script>
<script>
(function(){ "use strict";
YC.devBootstrap();
YC.renderNav();
/* 会话体检：token 失效时自动清理，避免拿旧会话查单 */
if(YC.user() && YC.remote()){ YC.authMe().catch(function(){ YC.logout(); YC.renderNav(); }); }
var main = document.getElementById("main");
var oid = new URLSearchParams(location.search).get("oid") || "";

function planLine(p){
  var seg = [];
  if(p.name) seg.push(p.name);
  if(p.area) seg.push(p.area + "㎡");
  if(p.door) seg.push("入户门·" + p.door);
  if(p.facing) seg.push(p.facing);
  return seg.join(" · ") || "未填写房源信息";
}

Promise.resolve(YC.getOrder(oid)).then(function(order){
  if(!order){
    var needLogin = !YC.user();
    main.innerHTML = '<div class="card empty"><div class="e-seal">空</div><p>'+
      (needLogin ? '请先登录后查看订单。' : '没有找到这个订单，可能已过期；若登录状态失效请重新登录后再试。')+
      '</p><div style="margin-top:18px;display:flex;gap:10px;justify-content:center">'+
      '<button class="btn btn-gold" id="reLogin">微信登录</button>'+
      '<a class="btn" href="upload.html">重新上传户型图</a></div></div>';
    document.getElementById("reLogin").onclick = function(){ YC.openLoginModal(function(){ location.reload(); }); };
    return;
  }
  if(order.status === "paid"){ location.replace("report.html?oid=" + encodeURIComponent(order.id)); return; }
  YC.serverHealth().then(function(h){
    render(order, !h || h.pay_mock !== false); // 拿不到健康信息时按 mock 处理，避免误导真实扣款
  });
});

function render(order, payMock){
  var mobile = YC.isMobile();
  var payCard =
    '<div class="card" style="text-align:center">'+
      '<h3 style="font-size:16px;margin-bottom:4px">微信支付'+(payMock?'<span class="mock-tag">内测模拟</span>':'')+'</h3>'+
      '<div id="payArea"></div>'+
      '<div class="hint" style="margin-top:14px">'+(payMock
        ? '内测阶段不发生真实扣款；支付成功后将自动生成分析报告'
        : '虚拟内容服务，报告生成即交付，<b>支付成功后不支持退款</b>；识别明显错误可免费重做一次')+'</div>'+
      '<div id="payErr" style="color:var(--bad);font-size:12.5px;margin-top:8px"></div>'+
      '<div style="margin-top:14px"><a href="orders.html" style="font-size:12.5px;color:var(--sub)">暂不支付，去订单中心</a></div>'+
    '</div>';
  main.innerHTML =
  '<div class="two-col">'+
    '<div class="card">'+
      '<h3 style="font-size:16px;margin-bottom:14px"><span class="seal">单</span>订单信息</h3>'+
      '<dl class="kv">'+
        '<dt>订单号</dt><dd>'+order.id+'</dd>'+
        '<dt>商品</dt><dd>'+order.title+'</dd>'+
        '<dt>房源</dt><dd class="dim">'+planLine(order.plan)+'</dd>'+
        '<dt>创建时间</dt><dd class="dim">'+YC.fmtTime(order.createdAt)+'</dd>'+
      '</dl>'+
      '<div style="margin-top:20px;display:flex;align-items:baseline;gap:12px">'+
        '<span class="pay-amount">¥'+order.amount.toFixed(1)+'<small> / 份</small></span>'+
        '<span class="price-old">原价 ¥'+order.amountOld+'</span>'+
        '<span class="badge b-gold">早鸟价</span>'+
      '</div>'+
    '</div>'+ payCard +
  '</div>';
  var area = document.getElementById("payArea");
  var err = document.getElementById("payErr");
  var go = "report.html?oid=" + encodeURIComponent(order.id);

  if(payMock){ /* 内测模拟：假码 + 一键支付成功 */
    area.innerHTML =
      '<p class="m-sub" style="color:var(--sub);font-size:12.5px;margin:10px 0 4px">'+(mobile?"点击按钮完成模拟支付":"请使用微信扫码完成支付")+'</p>'+
      (mobile?'':'<div class="qr"><canvas id="payQR" width="200" height="200"></canvas></div>')+
      '<div style="margin-top:14px"><button class="btn btn-gold" id="payBtn">模拟：支付成功</button></div>';
    var c = document.getElementById("payQR");
    if(c) YC.pseudoQR(c, "pay:" + order.id);
    document.getElementById("payBtn").onclick = function(){
      var b=this; b.disabled=true; b.textContent="支付确认中…";
      YC.payOrder(order.id, mobile?"jsapi":"native").then(function(o2){
        if(o2 && o2.status==="paid") location.href = go;
        else { b.disabled=false; b.textContent="模拟：支付成功"; }
      }).catch(function(e){ err.textContent=e.message; b.disabled=false; b.textContent="模拟：支付成功"; });
    };
    return;
  }

  /* 真实支付：PC 扫码；手机微信内 JSAPI 调起；手机浏览器截图后微信识别 */
  var inWechat = /MicroMessenger/i.test(navigator.userAgent);
  var scene = mobile ? "jsapi" : "native";
  area.innerHTML = '<p class="m-sub" style="color:var(--sub);font-size:12.5px;margin:10px 0">正在向微信支付下单…</p>';

  function pollPaid(){
    var n = 0;
    var timer = setInterval(function(){
      YC.getOrder(order.id).then(function(o3){
        if(o3 && o3.status === "paid"){ clearInterval(timer); location.href = go; }
        else if(++n > 150){ clearInterval(timer); err.textContent = "等待超时，请刷新页面重试"; }
      }).catch(function(){});
    }, 2000);
  }
  function showQR(codeUrl){
    area.innerHTML =
      '<p class="m-sub" style="color:var(--sub);font-size:12.5px;margin:10px 0 4px">'+
        (mobile ? '截图下方二维码 → 打开微信「扫一扫」→ 右上角相册选截图，完成支付'
                : '请使用微信「扫一扫」完成支付')+'</p>'+
      '<div class="qr"><canvas id="payQR" width="220" height="220"></canvas></div>'+
      '<div class="hint" style="margin-top:10px;color:var(--gold2)">等待支付结果，支付成功将自动跳转报告…</div>';
    var c = document.getElementById("payQR");
    if(!YC.drawQR(c, codeUrl)){ err.textContent = "二维码渲染失败，请刷新重试"; return; }
    pollPaid();
  }
  function invokeJsapi(params){
    function callPay(){
      WeixinJSBridge.invoke("getBrandWCPayRequest", params, function(res){
        if(res && res.err_msg === "get_brand_wcpay_request:ok"){
          area.innerHTML = '<p class="m-sub" style="color:var(--good);font-size:13px;margin:12px 0">支付成功，正在生成报告…</p>';
          pollPaid();
        }else if(res && res.err_msg === "get_brand_wcpay_request:cancel"){
          err.textContent = "已取消支付";
          YC.createPrepay(order.id, "native").then(function(p2){ if(p2 && p2.code_url) showQR(p2.code_url); });
        }else{
          err.textContent = "支付未完成，请重试";
          YC.createPrepay(order.id, "native").then(function(p2){ if(p2 && p2.code_url) showQR(p2.code_url); });
        }
      });
    }
    if(typeof WeixinJSBridge === "undefined"){
      document.addEventListener("WeixinJSBridgeReady", callPay, false);
    }else{ callPay(); }
  }

  YC.createPrepay(order.id, scene).catch(function(e){
    if(mobile) return YC.createPrepay(order.id, "native"); // JSAPI 不可用时回退扫码
    throw e;
  }).then(function(p){
    if(!p) return;
    if(p.status === "paid"){ location.href = go; return; }
    if(p.pay_params && inWechat){ invokeJsapi(p.pay_params); return; }
    if(p.pay_params){ // 手机浏览器拿到 jsapi 参数也用不了，回退扫码
      YC.createPrepay(order.id, "native").then(function(p2){ if(p2 && p2.code_url) showQR(p2.code_url); });
      return;
    }
    if(p.code_url){ showQR(p.code_url); return; }
    err.textContent = "下单应答异常，请重试";
  }).catch(function(e){
    err.textContent = e.message;
    area.innerHTML = '<div style="margin-top:10px"><button class="btn btn-gold" onclick="location.reload()">重新发起支付</button></div>';
  });
}
})();
</script>

</body>
</html>
