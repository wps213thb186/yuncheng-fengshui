<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>我的订单 - 运乘风水</title>
<meta name="robots" content="noindex">
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><rect width='100' height='100' rx='22' fill='%23241d10'/><text x='50' y='68' font-size='52' text-anchor='middle' fill='%23e6c886' font-family='serif'>运</text></svg>">
<link rel="stylesheet" href="assets/css/site.css">
</head>
<body>

<header class="topbar">
  <div class="wrap">
    <a class="brand" href="index.html">
      <span class="brand-seal">运</span>
      <span><span class="brand-name">运乘风水</span><br><span class="brand-sub">YUNCHENG · 户型居住环境分析</span></span>
    </a>
    <nav class="nav">
      <a href="index.html#why">为什么</a>
      <a href="index.html#flow">服务流程</a>
      <a href="index.html#price">价格</a>
      <a href="index.html#faq">常见问题</a>
      <a class="btn btn-gold btn-sm" href="upload.html">上传户型图</a>
    </nav>
  </div>
</header>

<main>
<div class="wrap page-head">
  <div class="eyebrow">ORDERS · 订单中心</div>
  <h1>我的订单与报告</h1>
  <p class="sub">全部订单与已生成的报告都保存在这里，报告永久可回看。</p>
</div>

<div class="wrap page-body" id="main"></div>
</main>

<footer>
  <div class="wrap">
    <div class="foot-brand">运 乘 风 水</div>
    <p>本站内容源自传统居住文化文献与师承经验整理，属于文化参考信息，不构成购房、居住或投资决策建议。</p>
    <p style="opacity:.6;margin-top:8px">© 2026 运乘风水 · 内测期间功能陆续开放</p>
  </div>
</footer>

<script src="assets/js/engine.js"></script>
<script src="assets/js/store.js"></script>
<script>
YC.devBootstrap();
YC.renderNav();
var main=document.getElementById("main");

if(!YC.user()){
  main.innerHTML='<div class="card empty"><div class="e-seal">单</div><p>登录后即可查看你的订单与报告</p></div>';
  YC.requireAuth(function(){ location.reload(); });
}else{
  var os=YC.listOrders();
  if(!os.length){
    main.innerHTML='<div class="card empty"><div class="e-seal">空</div><p>还没有订单。上传一张户型图，3 分钟拿到第一份报告。</p><div style="margin-top:18px"><a class="btn btn-gold" href="upload.html">上传户型图</a></div></div>';
  }else{
    var html='<div class="card" style="padding:10px 28px">';
    os.forEach(function(o){
      var paid=o.status==="paid";
      var door=o.plan&&o.plan.door?("入户门·"+o.plan.door+"（"+YC_ENG.DIRNAME[o.plan.door]+"）"):"";
      var meta=[YC.fmtTime(o.createdAt), door, o.plan&&o.plan.area?(o.plan.area+"㎡"):""].filter(Boolean).join(" · ");
      html+='<div class="order-row">'+
        (o.plan&&o.plan.img
          ? '<div class="order-thumb" style="background-image:url('+o.plan.img+')"></div>'
          : '<div class="order-thumb">运</div>')+
        '<div class="order-main"><div class="o-title">'+o.title+' <span style="color:var(--sub);font-size:12px">'+o.id+'</span></div>'+
        '<div class="o-meta">'+meta+'</div></div>'+
        '<div class="order-act">'+
          (paid?'<span class="badge b-good">已出报告</span>':'<span class="badge b-wait">待支付 ¥'+o.amount.toFixed(1)+'</span>')+
          (paid
            ? '<a class="btn btn-gold btn-sm" href="report.html?oid='+encodeURIComponent(o.id)+'">查看报告</a>'
            : '<a class="btn btn-ghost btn-sm" href="pay.html?oid='+encodeURIComponent(o.id)+'">去支付</a>')+
        '</div></div>';
    });
    html+='</div><div class="hint" style="margin-top:14px">内测阶段订单保存在本机浏览器；正式上线后同步到微信账号，换设备也能看。</div>';
    main.innerHTML=html;
  }
}
</script>

</body>
</html>
