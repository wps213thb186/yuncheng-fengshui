<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>微信授权登录 - 运乘风水</title>
<meta name="robots" content="noindex">
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><rect width='100' height='100' rx='22' fill='%23241d10'/><text x='50' y='68' font-size='52' text-anchor='middle' fill='%23e6c886' font-family='serif'>运</text></svg>">
<link rel="stylesheet" href="assets/css/site.css">
</head>
<body>
<main>
<div class="wrap page-body">
  <div class="card" style="max-width:420px;margin:80px auto;text-align:center">
    <div class="e-seal" style="margin:0 auto 14px">权</div>
    <h3 id="msg" style="font-size:17px;margin-bottom:8px">正在完成微信授权登录…</h3>
    <p id="sub" style="font-size:13px;color:var(--sub)">请稍候</p>
  </div>
</div>
</main>
<script src="assets/js/config.js"></script>
<script src="assets/js/store.js"></script>
<script>
(function(){
  var msg = document.getElementById("msg"), sub = document.getElementById("sub");
  var q = new URLSearchParams(location.search);
  var code = q.get("code"), state = q.get("state") || "";
  if(!code){ msg.textContent = "授权参数缺失"; sub.textContent = "请回到官网重新发起登录"; return; }
  var back = sessionStorage.getItem("yc_auth_back") || "upload.html";
  fetch((window.YC_API_BASE||"") + "/api/auth/wechat/web-code", {
    method: "POST", headers: {"Content-Type": "application/json"},
    body: JSON.stringify({ code: code, state: state })
  }).then(function(r){ return r.json().then(function(b){ return { ok: r.ok, b: b }; }); })
    .then(function(res){
      if(!res.ok) throw new Error(res.b.detail || "登录失败");
      if(res.b.bound === "ticket"){ // PC 扫码流程：本会话在手机上完成授权，回 PC 继续
        msg.textContent = "授权成功";
        sub.textContent = "请回到电脑浏览器继续操作，本页可关闭";
        return;
      }
      // 手机端流程：直接发证
      localStorage.setItem("yc_user_v1", JSON.stringify(res.b.user));
      localStorage.setItem("yc_token_v1", JSON.stringify(res.b.token));
      msg.textContent = "登录成功，正在跳转…";
      location.replace(back);
    })
    .catch(function(e){
      msg.textContent = "登录失败";
      sub.textContent = e.message + "，请回到官网重试";
    });
})();
</script>
</body>
</html>
